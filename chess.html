<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>中国象棋摆谱器 · 残局研究</title>
<style>
/* ===== 全局 ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
	font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Heiti SC", system-ui, sans-serif;
	background: radial-gradient(1300px 700px at 50% -12%, #6b4f36 0%, #4a3728 46%, #30231a 100%);
	background-attachment: fixed;
	color: #f0e2cc;
	min-height: 100vh;
	-webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,.18); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

/* ===== 布局 ===== */
.wrap { max-width: 1200px; margin: 0 auto; padding: 10px 12px 90px; }
.topbar {
	display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
	padding: 9px 12px; margin-bottom: 10px;
	background: rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.09); border-radius: 10px;
}
.brand { font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #e9c98d; margin-right: 4px; }
.main { display: grid; grid-template-columns: minmax(0,1fr) 350px; gap: 14px; align-items: start; }
.left { min-width: 0; }
.right { min-width: 0; }

/* ===== 控件 ===== */
.btn {
	background: linear-gradient(180deg,#6d4f33,#553a24); color: #f2e3c9;
	border: 1px solid rgba(255,255,255,.13); border-radius: 8px;
	padding: 7px 11px; cursor: pointer; font-size: 13px; line-height: 1.4;
}
.btn:hover { filter: brightness(1.14); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: linear-gradient(180deg,#a9793f,#8a5a2b); border-color: rgba(255,255,255,.2); }
.btn.wide { width: 100%; }
.btn.mini { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; overflow: hidden; }
.seg button {
	background: transparent; color: #e6d5b9; border: 0; border-right: 1px solid rgba(255,255,255,.1);
	padding: 7px 15px; cursor: pointer; font-size: 14px;
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: linear-gradient(180deg,#a9793f,#8a5a2b); color: #fff; font-weight: 600; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row.tight { gap: 4px; }
.turn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #e0cdae; margin-left: auto; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.4); }
.dot.r { background: radial-gradient(circle at 35% 30%, #f0907a, #b32b1c); }
.dot.b { background: radial-gradient(circle at 35% 30%, #8d8d8d, #2c2c2c); }

/* ===== 棋盘 ===== */
.boardWrap {
	background:
		repeating-linear-gradient(90deg, rgba(120,78,36,.11) 0 3px, rgba(255,236,200,.05) 3px 8px, rgba(140,95,50,.08) 8px 11px),
		radial-gradient(120% 90% at 50% 40%, #f2d49b 0%, #e0bb7c 55%, #c99f62 100%);
	border-radius: 14px;
	padding: 6px;
	box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 40px rgba(120,70,20,.25);
}
/* 棋盘按 viewBox 比例自适应，避免宽屏下产生居中留白 */
#board {
	display: block; width: 100%; height: auto;
	max-width: 100%;
	margin: 0 auto;
	touch-action: none; user-select: none; -webkit-user-select: none;
}
/* 桌面端按视口高度反推最大宽度，保证棋盘完整可见且不留横向空白 */
@media (min-width: 901px) {
	#board { max-width: calc((100vh - 190px) * 900 / 1146); }
}
.boardline { stroke: #5b3a1e; stroke-width: 2.2; fill: none; stroke-linecap: square; }
.boardline.thin { stroke-width: 1.1; }.river-txt { fill: #6b4523; font-size: 30px; letter-spacing: 8px; font-family: "KaiTi","STKaiti","Kaiti SC",serif; opacity: .85; }
.pnum { fill: #4a2f14; font-size: 18px; font-weight: 700; opacity: .92; font-family: "Microsoft YaHei",sans-serif; }
.pnum.t { opacity: .7; }

.piece { cursor: pointer; }
.piece .glyph { font-family: "KaiTi","STKaiti","Kaiti SC","楷体","Microsoft YaHei",serif; font-size: 42px; text-anchor: middle; font-weight: 700; }
.piece .glyph.r { fill: #a8331f; }
.piece .glyph.b { fill: #22201d; }
.piece .selRing { fill: none; stroke: #1f7ae0; stroke-width: 4; opacity: 0; }

.hint-dot { fill: #2b7a3d; opacity: .55; }
.hint-cap { fill: none; stroke: #c0392b; stroke-width: 4; opacity: .9; }
.hint-last { fill: none; stroke: #e8a33d; stroke-width: 3; opacity: .85; }
.hint-last.last { fill: rgba(232,163,61,.28); stroke: none; }
.arrow { stroke-width: 7; stroke-linecap: round; fill: none; opacity: .85; }
.arrow-head { opacity: .85; }
.mark-circle { fill: none; stroke-width: 3.5; opacity: .92; }
.mark-box { fill: none; stroke-width: 3.5; opacity: .92; }

/* ===== 面板 ===== */
.panel {
	background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
	border-radius: 12px; padding: 11px 12px; margin-bottom: 12px;
}
.panel h3 {
	margin: 0 0 9px; font-size: 13px; color: #e9c98d; letter-spacing: 1.5px;
	display: flex; align-items: center; gap: 6px;
}
.panel h3::before { content: ""; width: 3px; height: 13px; background: #a9793f; border-radius: 2px; }
.hinttext { font-size: 12px; color: #c7b393; line-height: 1.6; margin: 6px 0 0; }
.warn { color: #ff9c8a; }
.ok { color: #9fd8a4; }
input[type=text], textarea, select {
	width: 100%; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.14);
	border-radius: 7px; padding: 6px 8px; font-size: 12.5px; outline: none;
}
input[type=text]:focus, textarea:focus { border-color: #a9793f; }
textarea { resize: vertical; line-height: 1.5; }
input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; background: none; }
.lbl { font-size: 12px; color: #c7b393; margin: 8px 0 4px; display: block; }

/* ===== 调色板 ===== */
.pal { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
.pal button {
	aspect-ratio: 1/1; height: auto; padding: 0; border-radius: 50%;
	background: radial-gradient(circle at 34% 28%, #f8e9c4, #d9b478);
	border: 2px solid #7d5225; color: #a8331f; cursor: pointer;
	font-family: "KaiTi","STKaiti","Kaiti SC","楷体",serif; font-size: 19px; font-weight: 700;
	display: flex; align-items: center; justify-content: center;
}
.pal button.b { color: #22201d; }
.pal button.on { box-shadow: 0 0 0 3px #4a9bf0; transform: scale(1.06); }
.pal button.erase { background: linear-gradient(180deg,#5b5b5b,#3a3a3a); color: #eee; font-size: 15px; }

/* ===== 棋谱列表 ===== */
.movelist { max-height: 210px; overflow: auto; border: 1px solid rgba(255,255,255,.1); border-radius: 7px; background: rgba(0,0,0,.18); }
.movelist ol { margin: 0; padding: 6px 8px; list-style: none; }
.movelist li { display: flex; gap: 8px; padding: 3px 5px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.movelist li:nth-child(odd) { background: rgba(255,255,255,.04); }
.movelist li:hover { background: rgba(255,255,255,.12); }
.movelist li .no { color: #9b8a6a; width: 24px; flex: none; }
.movelist li .red { color: #f0907a; }
.movelist li .blk { color: #cfcfcf; }
.movelist li.cur { background: rgba(169,121,63,.45); }

/* ===== 收藏 ===== */
.favlist { display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow: auto; }
.favitem { background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.1); border-radius: 7px; padding: 6px 8px; }
.favitem .ft { font-size: 13px; color: #f0dcb4; word-break: break-all; }
.favitem .fm { font-size: 11px; color: #a9977a; margin: 2px 0 5px; word-break: break-all; }
.favitem .fr { display: flex; gap: 4px; flex-wrap: wrap; }

/* ===== 提示条 ===== */
#toast {
	position: fixed; left: 50%; bottom: 26px; z-index: 99;
	transform: translateX(-50%) translateY(8px);
	max-width: 88vw; padding: 9px 18px; border-radius: 20px;
	background: rgba(32, 22, 12, .94); color: #f2e3c9;
	font-size: 13.5px; line-height: 1.5; text-align: center;
	box-shadow: 0 6px 20px rgba(0,0,0,.45);
	border: 1px solid rgba(255,255,255,.12);
	opacity: 0; pointer-events: none;
	transition: opacity .18s ease, transform .18s ease;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: rgba(120, 28, 20, .95); border-color: rgba(255,140,120,.35); }

/* ===== 状态条 ===== */
.statusbar {
	margin-top: 8px; padding: 7px 11px; border-radius: 9px; font-size: 13px;
	background: rgba(0,0,0,.26); border: 1px solid rgba(255,255,255,.09);
	display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.quickbar { display: none; }

/* ===== 移动端 ===== */
@media (max-width: 900px) {
	.wrap { padding: 8px 8px 96px; }
	.main { grid-template-columns: 1fr; }
	.brand { font-size: 15px; }
	.topbar { gap: 8px; padding: 8px 10px; }
	.seg button { padding: 9px 14px; }
	.btn { padding: 9px 12px; }
	/* 移动端允许整块棋盘完整展示，不做限高 */
	#board { max-height: none; }
	.quickbar {
		display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
		gap: 6px; padding: 8px 10px; justify-content: space-around;
		background: rgba(28,20,14,.96); border-top: 1px solid rgba(255,255,255,.12);
		box-shadow: 0 -4px 14px rgba(0,0,0,.4);
	}
	.quickbar .btn { flex: 1; text-align: center; }
	/* 提示条上移，避免被底部快捷条遮挡 */
	#toast { bottom: 76px; }
	.pal button { font-size: 21px; }
	.movelist { max-height: 150px; }
}
@media (pointer: coarse) {
	.btn { padding: 10px 13px; }
	.seg button { padding: 11px 16px; }
	.pal button { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<div class="brand">中国象棋 · 摆谱器</div>
		<div class="seg" id="segMode">
			<button data-mode="setup" class="on" aria-pressed="true">摆谱</button>
			<button data-mode="move" aria-pressed="false">走子</button>
			<button data-mode="mark" aria-pressed="false">标注</button>
		</div>
		<button class="btn" id="btnFlip" title="旋转棋盘 180°，便于从对方视角看盘">翻转棋盘</button>
		<button class="btn" id="btnSelftest" title="运行内置规则回归测试">规则自测</button>
		<div class="turn" id="turnInd"><span class="dot r"></span>红方走棋</div>
	</header>

	<div class="main">
		<section class="left">
			<div class="boardWrap">
				<svg id="board" viewBox="0 0 900 1146" preserveAspectRatio="xMidYMid meet" role="application" aria-label="中国象棋棋盘，可点击选择与移动棋子"></svg>
			</div>
			<div class="statusbar" id="statusbar"></div>
		</section>

		<aside class="right">

			<div class="panel" id="panelSetup">
				<h3>摆谱 · 调色板</h3>
				<div class="pal" id="palette"></div>
				<div class="row" style="margin-top:8px">
					<button class="btn mini" id="btnClearCell">清空该格</button>
					<button class="btn mini" id="btnClearAll">清空全盘</button>
					<button class="btn mini" id="btnInit">初始局面</button>
				</div>
				<div class="lbl">载入经典残局</div>
				<select id="presetSel"></select>
				<div class="row" style="margin-top:6px">
					<button class="btn mini pri" id="btnPresetLoad">载入</button>
				</div>
				<p class="hinttext" id="presetTip"></p>
			</div>

			<div class="panel">
				<h3>走子 · 棋谱</h3>
				<div class="row">
					<button class="btn mini" id="btnUndo">撤销</button>
					<button class="btn mini" id="btnRedo">重做</button>
					<button class="btn mini" id="btnPrev">上一步</button>
					<button class="btn mini" id="btnNext">下一步</button>
					<button class="btn mini" id="btnRestart">回到开局</button>
					<button class="btn mini" id="btnSwapTurn">换边</button>
				</div>
				<div class="movelist" style="margin-top:8px">
					<ol id="moveList"></ol>
				</div>
				<div class="row" style="margin-top:8px">
					<button class="btn mini" id="btnCopyGame">复制棋谱</button>
					<button class="btn mini" id="btnCopyGameFen">复制棋谱+FEN</button>
					<button class="btn mini" id="btnClearGame">清空棋谱</button>
				</div>
			</div>

			<div class="panel">
				<h3>FEN 局面</h3>
				<input type="text" id="fenCurrent" readonly>
				<div class="row" style="margin-top:6px">
					<button class="btn mini pri" id="btnCopyFen">复制当前 FEN</button>
				</div>
				<div class="lbl">粘贴 FEN 并应用</div>
				<textarea id="fenInput" rows="3" placeholder="例：rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1"></textarea>
				<div class="row" style="margin-top:6px">
					<button class="btn mini pri" id="btnApplyFen">应用</button>
					<button class="btn mini" id="btnPasteFen">从剪贴板粘贴</button>
				</div>
				<p class="hinttext" id="fenTip"></p>
			</div>

			<div class="panel">
				<h3>标注 · 箭头与标记</h3>
				<div class="seg" id="segMark" style="width:100%">
					<button data-tool="circle" class="on" aria-pressed="true" style="flex:1">圈</button>
					<button data-tool="box" aria-pressed="false" style="flex:1">方框</button>
					<button data-tool="arrow" aria-pressed="false" style="flex:1">箭头</button>
				</div>
				<div class="row" style="margin-top:8px">
					<span style="font-size:12px;color:#c7b393">颜色</span>
					<input type="color" id="markColor" value="#c0392b">
					<button class="btn mini" id="btnDelMark">删除该点标注</button>
					<button class="btn mini" id="btnClearMarks">清空标注</button>
				</div>
				<p class="hinttext">箭头：先点起点，再点终点；再次点击同一点可取消。标注会随收藏一同保存。</p>
			</div>

			<div class="panel">
				<h3>收藏 · 本地棋谱库</h3>
				<input type="text" id="favName" placeholder="局面名称，如：车马残局 A">
				<textarea id="favNotes" rows="2" placeholder="研究备注（可选）" style="margin-top:5px"></textarea>
				<div class="row" style="margin-top:6px">
					<button class="btn mini pri" id="btnSaveFav">保存当前局面</button>
				</div>
				<div class="favlist" id="favList" style="margin-top:8px"></div>
				<div class="row" style="margin-top:8px">
					<button class="btn mini" id="btnExportFav">导出 JSON</button>
					<button class="btn mini" id="btnImportFav">导入 JSON</button>
					<input type="file" id="fileFav" accept=".json,application/json" style="display:none">
				</div>
			</div>

		</aside>
	</div>
</div>

<div class="quickbar" id="quickbar">
	<button class="btn mini" id="qUndo">撤销</button>
	<button class="btn mini" id="qRedo">重做</button>
	<button class="btn mini" id="qPrev">上一步</button>
	<button class="btn mini" id="qNext">下一步</button>
	<button class="btn mini" id="qFlip">翻转</button>
</div>

<script>
/* ============================================================
 * 中国象棋摆谱器 —— 单文件实现
 * 模块划分：
 *   0 常量与工具      1 规则引擎 CORE
 *   2 FEN 读写        3 中文记谱
 *   4 渲染 VIEW       5 控制 CTRL      6 收藏 STORE   7 预置残局
 * ============================================================ */
var XQ = {};
(function () {
	'use strict';

	/* ===== 模块 0：常量与工具 ===== */
	var ROWS = 10, COLS = 9, SIZE = 90;
	/* BOARD_TOP 为首行纵线位置，上方留 46px 给黑方纵线号；末行下方同理留白 */
	var PAD = 50, BOARD_TOP = 96, CELL = 100, VB_W = 900, VB_H = 1146;
	var DRAG_THRESHOLD = 7;

	/* 棋子：红方大写，黑方小写，与 FEN 字母一一对应 */
	var PIECE_NAME = {
		r: { K: '帅', A: '仕', B: '相', N: '马', R: '车', C: '炮', P: '兵' },
		b: { K: '将', A: '士', B: '象', N: '马', R: '车', C: '炮', P: '卒' }
	};
	var CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
	var INITIAL_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1';

	/* 直行四方向 */
	var ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
	/* 斜行四方向 */
	var DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
	/* 马的八个方向（蹩腿判定依赖此表，保持唯一数据源） */
	var HORSE = [[-2, -1], [-2, 1], [2, -1], [2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2]];
	/* 象的四个方向 */
	var ELEPH = [[-2, -2], [-2, 2], [2, -2], [2, 2]];

	function idx2rc(i) { return { row: Math.floor(i / COLS), col: i % COLS }; }
	function rc2idx(r, c) { return r * COLS + c; }
	function inBoard(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
	/* 大写=红方 */
	function colorOf(ch) { return ch === ch.toUpperCase() ? 'r' : 'b'; }
	function typeOf(ch) { return ch.toUpperCase(); }
	function otherSide(s) { return s === 'r' ? 'b' : 'r'; }
	/* 九宫：纵线 3~5，黑方行 0~2，红方行 7~9 */
	function inPalace(r, c, side) {
		if (c < 3 || c > 5) return false;
		return side === 'r' ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
	}
	/* 是否已过河：红兵 row<=4，黑卒 row>=5 */
	function crossedRiver(ch, row) { return colorOf(ch) === 'r' ? row <= 4 : row >= 5; }
	function cloneBoard(b) { return b.slice(); }

	/* ===== 模块 1：规则引擎 CORE ===== */
	var CORE = {};

	/* 寻找某方将/帅，返回索引；不存在返回 -1 */
	CORE.findKing = function (board, side) {
		var want = side === 'r' ? 'K' : 'k';
		for (var i = 0; i < SIZE; i++) {
			if (board[i] === want) return i;
		}
		return -1;
	};

	/* 将帅照面：同一直线且中间无子 */
	CORE.kingsFacing = function (board) {
		var kr = CORE.findKing(board, 'r'), kb = CORE.findKing(board, 'b');
		if (kr < 0 || kb < 0) return false;
		var a = idx2rc(kr), b = idx2rc(kb);
		if (a.col !== b.col) return false;
		var step = a.row < b.row ? 1 : -1;
		for (var r = a.row + step; r !== b.row; r += step) {
			if (board[rc2idx(r, a.col)]) return false;
		}
		return true;
	};

	/*
	 * 单个棋子的几何可走点（伪合法：仅考虑走法与阻挡，不考虑走后是否送将）
	 * 不包含"飞将"吃对方将帅——照面规则由 kingsFacing 单独判定。
	 */
	CORE.pseudoTargets = function (board, idx) {
		var ch = board[idx];
		if (!ch) return [];
		var side = colorOf(ch), t = typeOf(ch);
		var rc = idx2rc(idx), r = rc.row, c = rc.col;
		var out = [], i, dr, dc, tr, tc, ti, tgt, eye, leg;

		if (t === 'K') {
			/* 帅/将：九宫内正行一步 */
			for (i = 0; i < 4; i++) {
				tr = r + ORTHO[i][0]; tc = c + ORTHO[i][1];
				if (!inPalace(tr, tc, side)) continue;
				ti = rc2idx(tr, tc);
				tgt = board[ti];
				if (tgt && colorOf(tgt) === side) continue;
				out.push(ti);
			}
		} else if (t === 'A') {
			/* 士/仕：九宫内斜行一步 */
			for (i = 0; i < 4; i++) {
				tr = r + DIAG[i][0]; tc = c + DIAG[i][1];
				if (!inPalace(tr, tc, side)) continue;
				ti = rc2idx(tr, tc);
				tgt = board[ti];
				if (tgt && colorOf(tgt) === side) continue;
				out.push(ti);
			}
		} else if (t === 'B') {
			/* 象/相：田字，不可过河（按终点行判定），塞象眼则不可行 */
			for (i = 0; i < 4; i++) {
				dr = ELEPH[i][0]; dc = ELEPH[i][1];
				tr = r + dr; tc = c + dc;
				if (!inBoard(tr, tc)) continue;
				if (side === 'r' && tr <= 4) continue;
				if (side === 'b' && tr >= 5) continue;
				eye = board[rc2idx(r + dr / 2, c + dc / 2)];
				if (eye) continue;
				ti = rc2idx(tr, tc);
				tgt = board[ti];
				if (tgt && colorOf(tgt) === side) continue;
				out.push(ti);
			}
		} else if (t === 'N') {
			/* 马：日字，蹩马腿则不可行 */
			for (i = 0; i < 8; i++) {
				dr = HORSE[i][0]; dc = HORSE[i][1];
				tr = r + dr; tc = c + dc;
				if (!inBoard(tr, tc)) continue;
				if (dr === 2 || dr === -2) leg = rc2idx(r + dr / 2, c);
				else leg = rc2idx(r, c + dc / 2);
				if (board[leg]) continue;
				ti = rc2idx(tr, tc);
				tgt = board[ti];
				if (tgt && colorOf(tgt) === side) continue;
				out.push(ti);
			}
		} else if (t === 'R') {
			/* 车：直线滑行，遇子即止 */
			for (i = 0; i < 4; i++) {
				dr = ORTHO[i][0]; dc = ORTHO[i][1];
				tr = r + dr; tc = c + dc;
				while (inBoard(tr, tc)) {
					ti = rc2idx(tr, tc);
					tgt = board[ti];
					if (!tgt) { out.push(ti); }
					else {
						if (colorOf(tgt) !== side) out.push(ti);
						break;
					}
					tr += dr; tc += dc;
				}
			}
		} else if (t === 'C') {
			/* 炮：无炮架时可走空格（不可吃子）；隔且仅隔一个炮架时可吃子 */
			for (i = 0; i < 4; i++) {
				dr = ORTHO[i][0]; dc = ORTHO[i][1];
				tr = r + dr; tc = c + dc;
				while (inBoard(tr, tc)) {
					ti = rc2idx(tr, tc);
					if (!board[ti]) { out.push(ti); tr += dr; tc += dc; continue; }
					/* 遇到第一个子视为炮架，架后第一个子方可吃 */
					tr += dr; tc += dc;
					while (inBoard(tr, tc)) {
						ti = rc2idx(tr, tc);
						if (!board[ti]) { tr += dr; tc += dc; continue; }
						if (colorOf(board[ti]) !== side) out.push(ti);
						break;
					}
					break;
				}
			}

			var fwd = side === 'r' ? -1 : 1;
			tr = r + fwd;
			if (inBoard(tr, c)) {
				ti = rc2idx(tr, c);
				tgt = board[ti];
				if (!tgt || colorOf(tgt) !== side) out.push(ti);
			}
			if (crossedRiver(ch, r)) {
				if (c - 1 >= 0) {
					ti = rc2idx(r, c - 1);
					tgt = board[ti];
					if (!tgt || colorOf(tgt) !== side) out.push(ti);
				}
				if (c + 1 < COLS) {
					ti = rc2idx(r, c + 1);
					tgt = board[ti];
					if (!tgt || colorOf(tgt) !== side) out.push(ti);
				}
			}
		}
		return out;
	};

	/*
	 * 某方是否攻击 target 格子。
	 * 采用"着法是否合法"判定：被钉住的子其实无法攻击对方，
	 * 因此模拟该攻击着法后，若攻击方自身被将军，则不算真实攻击。

	function isSquareAttacked(board, target, bySide, depth) {
		var i, idx, ch, tgts, k, real, saved;
		depth = depth || 0;
		k = CORE.findKing(board, bySide);
		for (i = 0; i < SIZE; i++) {
			ch = board[i];
			if (!ch || colorOf(ch) !== bySide) continue;
			tgts = CORE.pseudoTargets(board, i);
			if (tgts.indexOf(target) < 0) continue;

			/* 攻击方无将帅、与将帅不成一线、或递归过深时，直接判定为真实攻击 */
			if (k < 0 || depth >= 2 || !aligned(idx2rc(i), idx2rc(k))) return true;

			/* 模拟攻击着法，检查攻击方自身是否被将军（即是否被钉住） */
			saved = board[target];
			board[i] = null;
			board[target] = ch;
			real = !CORE.isInCheck(board, bySide, depth + 1);
			board[target] = saved;
			board[i] = ch;
			if (real) return true;
		}

	/* 走子是否合法：几何合法 + 不吃对方将帅 + 走后己方不被将军 */
	CORE.isLegalMove = function (board, from, to) {
		var ch = board[from];
		if (!ch) return false;
		var side = colorOf(ch);
		if (CORE.pseudoTargets(board, from).indexOf(to) < 0) return false;
		var tgt = board[to];
		if (tgt && typeOf(tgt) === 'K') return false;   /* 禁止吃将帅 */
		board[from] = null;
		board[to] = ch;
		var ok = !CORE.isInCheck(board, side);
		board[to] = tgt;
		board[from] = ch;
		return ok;
	};

	/* 生成某方全部合法着法 */
	CORE.generateMoves = function (board, side) {
		var out = [], i, tgts, j, tgt;
		for (i = 0; i < SIZE; i++) {
			if (!board[i] || colorOf(board[i]) !== side) continue;
			tgts = CORE.pseudoTargets(board, i);
			for (j = 0; j < tgts.length; j++) {
				tgt = board[tgts[j]];
				if (tgt && typeOf(tgt) === 'K') continue;   /* 禁止吃将帅 */
				if (CORE.isLegalMove(board, i, tgts[j])) {
					out.push({ from: i, to: tgts[j], piece: board[i] });
				}
			}
		}
		return out;
	};

	CORE.makeMove = function (board, from, to) {
		var captured = board[to];
		board[to] = board[from];
		board[from] = null;
		return captured;
	};
	CORE.undoMove = function (board, from, to, captured) {
		board[from] = board[to];
		board[to] = captured || null;
	};

	/* 非法着法原因，供界面提示 */
	CORE.explainIllegal = function (board, from, to) {
		var ch = board[from];
		if (!ch) return '起点没有棋子';
		var side = colorOf(ch);
		var tgt = board[to];
		if (tgt && colorOf(tgt) === side) return '不能吃自己的棋子';
		if (tgt && typeOf(tgt) === 'K') return '不可直接吃掉将帅';
		if (CORE.pseudoTargets(board, from).indexOf(to) < 0) {
			return '不符合' + PIECE_NAME[side][typeOf(ch)] + '的走法';
		}
		var saved = CORE.makeMove(board, from, to);
		var bad = CORE.isInCheck(board, side);
		CORE.undoMove(board, from, to, saved);

		return '不合法的着法';

	/* 局面合法性体检（摆谱允许不合法局面，仅提示不阻断） */
	CORE.validatePosition = function (board) {
		var msgs = [], level = 'ok';
		var kr = CORE.findKing(board, 'r'), kb = CORE.findKing(board, 'b');
		if (kr < 0) { msgs.push('缺少红方帅'); level = 'error'; }
		if (kb < 0) { msgs.push('缺少黑方将'); level = 'error'; }
		if (kr >= 0 && kb >= 0 && CORE.kingsFacing(board)) {
			msgs.push('将帅照面（白脸将），该局面不合法'); level = 'error';
		}
		/* 棋子数量按阵营分别统计，红帅与黑将不可混算 */
		var count = {}, i, key, max = { P: 5, R: 2, N: 2, C: 2, A: 2, B: 2, K: 1 };
		for (i = 0; i < SIZE; i++) {
			if (!board[i]) continue;
			key = colorOf(board[i]) + typeOf(board[i]);
			count[key] = (count[key] || 0) + 1;
		}
		for (key in max) {
			if (!max.hasOwnProperty(key)) continue;
			if ((count['r' + key] || 0) > max[key]) {
				msgs.push('红方' + PIECE_NAME.r[key] + '数量超过 ' + max[key] + ' 个');
				if (level === 'ok') level = 'warn';
			}
			if ((count['b' + key] || 0) > max[key]) {
				msgs.push('黑方' + PIECE_NAME.b[key] + '数量超过 ' + max[key] + ' 个');
				if (level === 'ok') level = 'warn';
			}

	/* ===== 模块 2：FEN 读写 ===== */
	var FEN = {};

	FEN.toFen = function (state) {
		var parts = [], r, c, ch, empty, s;
		for (r = 0; r < ROWS; r++) {
			s = ''; empty = 0;
			for (c = 0; c < COLS; c++) {
				ch = state.board[rc2idx(r, c)];
				if (!ch) { empty++; continue; }
				if (empty > 0) { s += empty; empty = 0; }
				s += ch;
			}
			if (empty > 0) s += empty;
			parts.push(s);
		}
		return parts.join('/') + ' ' + (state.turn === 'r' ? 'w' : 'b') + ' - - 0 1';
	};

	FEN.parse = function (text) {
		text = (text || '').trim().replace(/\s+/g, ' ');
		if (!text) throw new Error('FEN 内容为空');
		var seg = text.split(' ');
		var rows = seg[0].split('/');
		if (rows.length !== ROWS) throw new Error('棋盘应为 10 行，实际 ' + rows.length + ' 行');
		var board = [], r, c, i, line, ch, col, w, isRed;
		for (i = 0; i < SIZE; i++) board[i] = null;
		for (r = 0; r < ROWS; r++) {
			line = rows[r]; col = 0; i = 0;
			while (i < line.length) {
				ch = line.charAt(i);
				if (ch >= '1' && ch <= '9') { col += parseInt(ch, 10); i++; continue; }
				/* 大写代表红方，小写代表黑方，先定阵营再映射字母 */
				isRed = (ch === ch.toUpperCase());
				w = ch.toUpperCase();
				if (w === 'E') w = 'B';        /* WXF 变体：E=象 */
				else if (w === 'H') w = 'N';   /* WXF 变体：H=马 */
				if ('KABNRCP'.indexOf(w) < 0) { i++; continue; }  /* 跳过无法识别的字符 */
				if (col >= COLS) throw new Error('第 ' + (r + 1) + ' 行棋子过多');
				board[rc2idx(r, col)] = isRed ? w : w.toLowerCase();
				col++; i++;
			}
			if (col !== COLS) throw new Error('第 ' + (r + 1) + ' 行宽度应为 9，实际 ' + col);
		}
		var turn = 'r';
		if (seg.length > 1) {
			w = seg[1].toUpperCase();
			if (w === 'B') turn = 'b';
			else turn = 'r';   /* w / r 均视为红方先行 */
		}
		return { board: board, turn: turn };
	};

	/* ===== 模块 3：中文记谱 ===== */
	var NOTATION = {};

	function fileChar(side, n) { return side === 'r' ? CN_NUM[n - 1] : String(n); }
	function digitChar(side, n) { return side === 'r' ? CN_NUM[n - 1] : String(n); }

	/*
	 * 前/后/中 消歧：同一方同一种棋子处于同一纵线时需要标注。
	 * "前" = 更靠近对方。红方 row 小者为前，黑方 row 大者为前。
	 */
	NOTATION.disambiguate = function (board, side, type, col, startRow) {
		var rows = [], r, ch;
		for (r = 0; r < ROWS; r++) {
			ch = board[rc2idx(r, col)];
			if (ch && colorOf(ch) === side && typeOf(ch) === type) rows.push(r);
		}
		if (rows.length <= 1) return '';
		rows.sort(function (a, b) { return side === 'r' ? a - b : b - a; });
		var pos = rows.indexOf(startRow);
		if (pos < 0) return '';
		if (rows.length === 2) return pos === 0 ? '前' : '后';
		if (rows.length === 3) return ['前', '中', '后'][pos];
		return ['前', '二', '三', '四', '五'][pos];
	};

	/*
	 * 生成中文着法。
	 * 结构：前缀 + 棋子名 + 起点纵线 + 动作(平/进/退) + 尾部
	 *   平       → 尾部为目标纵线
	 *   直行类进退 → 尾部为移动格数
	 *   斜行类进退 → 尾部为目标纵线
	 */
	NOTATION.toChinese = function (state, from, to) {
		var ch = state.board[from];
		if (!ch) return '';
		var side = colorOf(ch), t = typeOf(ch);
		var a = idx2rc(from), b = idx2rc(to);
		var name = PIECE_NAME[side][t];
		var startFile = side === 'r' ? (COLS - a.col) : (a.col + 1);
		var endFile = side === 'r' ? (COLS - b.col) : (b.col + 1);
		var forward = side === 'r' ? (b.row < a.row) : (b.row > a.row);
		var action = (b.row === a.row) ? '平' : (forward ? '进' : '退');
		var tail, prefix;

		if (action === '平') {
			tail = fileChar(side, endFile);
		} else if (t === 'K' || t === 'R' || t === 'C' || t === 'P') {
			tail = digitChar(side, Math.abs(b.row - a.row));
		} else {
			tail = fileChar(side, endFile);
		}

		prefix = NOTATION.disambiguate(state.board, side, t, a.col, a.row);
		if (prefix) {
			/* 有前/后消歧时，按传统记谱省略起点纵线，如「前炮平五」 */

	/* 棋谱文本导出：跳过起始局面等无着法的条目，从 1 重新编号 */

		}
		return out.join('\n');
	};

	/* ===== 模块 4：渲染 VIEW ===== */
	var VIEW = {};

	/* 绘制静态棋盘：外框、横线、竖线、九宫、河界、炮兵位星 */
	VIEW.buildGrid = function () {
		clear(gGrid);
		var x0 = PAD, x1 = PAD + 8 * CELL, y0 = PAD, y1 = PAD + 9 * CELL, i, j, r, c;

	/* 外框（双线） */
		el('rect', { x: x0 - 22, y: y0 - 22, width: (x1 - x0) + 44, height: (y1 - y0) + 44, fill: 'none', stroke: '#6b4523', 'stroke-width': 4 }, gGrid);
		el('rect', { x: x0 - 12, y: y0 - 12, width: (x1 - x0) + 24, height: (y1 - y0) + 24, fill: 'none', stroke: '#6b4523', 'stroke-width': 1.6, opacity: .7 }, gGrid);

		/* 横线：10 条，其中第 5、6 条之间为河界 */
		for (r = 0; r < ROWS; r++) {
			el('line', { x1: x0, y1: vy(r), x2: x1, y2: vy(r), class: 'boardline' }, gGrid);
		}
		/* 竖线：最外两条贯通，中间 7 条在河界处断开 */
		for (c = 0; c < COLS; c++) {
			if (c === 0 || c === COLS - 1) {

			} else {
				el('line', { x1: vx(c), y1: y0, x2: vx(c), y2: vy(4), class: 'boardline' }, gGrid);

		t2.appendChild(document.createTextNode('汉 界'));
	};

	/* 星标：交叉点四周的四段短线 */
	VIEW.starMark = function (x, y, parent) {
		var g = el('g', { class: 'thin', stroke: '#6b4523', 'stroke-width': 1.4, opacity: .8 }, parent);

		el('line', { x1: x - b, y1: y - a, x2: x - a, y2: y - a }, g);

	/*
	 * 纵线号：绘制在棋盘上下边缘的外侧留白区。
	 * 棋子半径 R=40，格宽 100，交点上下各留 10px 间隙不足以放字，
	 * 故 BOARD_TOP 上方另留 46px、末行下方另留 46px 专供编号使用。
	 * 红方用汉字自右向左（一在右下），黑方用数字自左向右（1 在左上）。
	 */
	function fileNumber(side, col) { return side === 'r' ? (COLS - col) : (col + 1); }

	VIEW.renderNumbers = function (flipped) {
		clear(gNum);
		var bottom = flipped ? 'b' : 'r';
		var top = flipped ? 'r' : 'b';
		var sc, c, num, t;
		for (sc = 0; sc < COLS; sc++) {
			/* 屏幕列 → 内部列（翻转时左右互换） */
			c = flipped ? (8 - sc) : sc;

			/* 上沿：另一方的纵线号 */
			num = fileNumber(top, c);
			t = el('text', {
				x: vx(sc), y: BOARD_TOP - 32, class: 'pnum t',
				'text-anchor': 'middle', dy: '0.35em'
			}, gNum);
			t.appendChild(document.createTextNode(top === 'r' ? CN_NUM[num - 1] : String(num)));

			/* 下沿：底部一方的纵线号 */
			num = fileNumber(bottom, c);
			t = el('text', {
				x: vx(sc), y: BOARD_TOP + 9 * CELL + 62, class: 'pnum',
				'text-anchor': 'middle', dy: '0.35em'
			}, gNum);
			t.appendChild(document.createTextNode(bottom === 'r' ? CN_NUM[num - 1] : String(num)));
		}
	};

	/* 棋子 */
	VIEW.renderPieces = function (board, flipped) {
		clear(gPieces);
		var i, ch, side, g, t, x, y;
		for (i = 0; i < SIZE; i++) {
			ch = board[i];
			if (!ch) continue;
			side = colorOf(ch);
			x = vx(i % COLS); y = vy(Math.floor(i / COLS));
			g = el('g', { class: 'piece ' + side, transform: 'translate(' + x + ',' + y + ')' }, gPieces);
			el('circle', { r: 42, fill: 'url(#gWood)', stroke: side === 'r' ? '#a4451f' : '#3b3128', 'stroke-width': 2.4, class: 'body' }, g);
			el('circle', { r: 34, fill: 'none', stroke: side === 'r' ? '#b95c33' : '#5c4c3a', 'stroke-width': 1.4, class: 'ring' }, g);
			el('circle', { r: 46, class: 'selRing' }, g);
			/* 棋盘整体翻转时，棋子文字反向补偿，保持字始终正立可读 */
			t = el('text', {
				x: 0, y: 0, class: 'glyph ' + side, dy: '0.35em', 'text-anchor': 'middle',
				transform: flipped ? 'rotate(180)' : ''
			}, g);
			t.appendChild(document.createTextNode(PIECE_NAME[side][typeOf(ch)]));
		}
	};

	/* 高亮：选中、合法落点、上一步、被将军 */
	VIEW.renderHints = function (board, sel, targets, lastMove, checkIdx) {
		clear(gHints);
		var i, x, y, g;
		if (sel !== null && sel !== undefined && board[sel]) {
			x = vx(sel % COLS); y = vy(Math.floor(sel / COLS));
			el('circle', { cx: x, cy: y, r: 46, fill: 'none', stroke: '#1f7ae0', 'stroke-width': 3.5, opacity: .95 }, gHints);
		}
		for (i = 0; i < (targets || []).length; i++) {
			var idx = targets[i];
			x = vx(idx % COLS); y = vy(Math.floor(idx / COLS));
			if (board[idx]) {
				el('circle', { cx: x, cy: y, r: 46, fill: 'none', stroke: '#c0392b', 'stroke-width': 3.5, class: 'hint-cap' }, gHints);
			} else {
				el('circle', { cx: x, cy: y, r: 12, class: 'hint-dot' }, gHints);
			}
		}
		if (lastMove) {
			x = vx(lastMove.from % COLS); y = vy(Math.floor(lastMove.from / COLS));
			el('rect', { x: x - 44, y: y - 44, width: 88, height: 88, rx: 4, class: 'hint-last' }, gHints);
			x = vx(lastMove.to % COLS); y = vy(Math.floor(lastMove.to / COLS));
			el('circle', { cx: x, cy: y, r: 46, class: 'hint-last last' }, gHints);
		}
		if (checkIdx !== null && checkIdx !== undefined && checkIdx >= 0) {
			x = vx(checkIdx % COLS); y = vy(Math.floor(checkIdx / COLS));
			g = el('g', {}, gHints);
			el('circle', { cx: x, cy: y, r: 48, fill: 'none', stroke: '#e03a2f', 'stroke-width': 4, opacity: .9 }, g);
		}
	};

	/* 研究标注：圈与方框 */
	VIEW.renderMarks = function (marks) {
		clear(gMarks);
		var i, m, x, y;
		for (i = 0; i < (marks || []).length; i++) {
			m = marks[i];
			x = vx(m.col); y = vy(m.row);
			if (m.type === 'box') {
				el('rect', { x: x - 46, y: y - 46, width: 92, height: 92, rx: 8, class: 'mark-box', stroke: m.color || '#c0392b' }, gMarks);
			} else {
				el('circle', { cx: x, cy: y, r: 44, class: 'mark-circle', stroke: m.color || '#c0392b' }, gMarks);
			}
		}
	};

	/* 研究箭头：实线表示确定着法，虚线表示假设 */
	VIEW.renderArrows = function (arrows) {
		clear(gArrows);
		var i, a, x1, y1, x2, y2, ang, len, hw, hl, bx, by;
		for (i = 0; i < (arrows || []).length; i++) {
			a = arrows[i];
			x1 = vx(a.from.col); y1 = vy(a.from.row);
			x2 = vx(a.to.col); y2 = vy(a.to.row);
			ang = Math.atan2(y2 - y1, x2 - x1);
			len = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
			if (len < 1) continue;
			hw = 15; hl = 30;
			/* 箭杆末端缩短，给箭头留位置 */
			bx = x2 - Math.cos(ang) * hl * 0.7;
			by = y2 - Math.sin(ang) * hl * 0.7;
			el('line', {
				x1: x1, y1: y1, x2: bx, y2: by,
				stroke: a.color || '#c0392b', class: 'arrow',
				'stroke-dasharray': a.style === 'dashed' ? '12 9' : 'none'
			}, gArrows);
			el('polygon', {
				points: [
					x2 + ',' + y2,
					(x2 - Math.cos(ang - 0.42) * hl) + ',' + (y2 - Math.sin(ang - 0.42) * hl),
					(x2 - Math.cos(ang + 0.42) * hl) + ',' + (y2 - Math.sin(ang + 0.42) * hl)
				].join(' '),
				fill: a.color || '#c0392b', class: 'arrow-head'
			}, gArrows);
		}
	};

	/* 翻转：仅改变渲染层，绝不改动内部坐标 */
	VIEW.setFlipped = function (flipped) {
		gRot.setAttribute('transform', flipped
			? 'rotate(180 ' + (VB_W / 2) + ' ' + (BOARD_TOP + 9 * CELL / 2) + ')'
			: '');
		VIEW.renderNumbers(flipped);
	};
	/*
	 * 命中测试：客户端坐标 → 棋盘索引。
	 * 用 getScreenCTM() 反算，可自动处理 viewBox 缩放与居中留白，
	 * 避免宽屏下容器比例与 viewBox 不一致导致的横向偏移。
	 */
	VIEW.hitTest = function (clientX, clientY) {
		if (!svg) return -1;
		var ctm = svg.getScreenCTM();
		if (!ctm) return -1;
		var pt;
		try {
			pt = svg.createSVGPoint();
		} catch (e) {
			return -1;
		}
		pt.x = clientX; pt.y = clientY;
		var p = pt.matrixTransform(ctm.inverse());
		/* 反向应用翻转矩阵：旋转发生在棋盘内容区（中心为棋盘中心） */
		if (APP.flipped) {
			p.x = (PAD + 8 * CELL) - (p.x - PAD);
			p.y = (BOARD_TOP + 9 * CELL) - (p.y - BOARD_TOP);
		}
		var col = Math.round((p.x - PAD) / CELL);
		var row = Math.round((p.y - BOARD_TOP) / CELL);
		if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return -1;
		/* 允许一定容差，避免手指落点偏差导致点空 */
		if (Math.abs(p.x - vx(col)) > CELL * 0.55 || Math.abs(p.y - vy(row)) > CELL * 0.55) return -1;
		return rc2idx(row, col);
	};

	/* ===== 模块 5：控制器 CTRL ===== */
	var APP = {
		board: [],
		turn: 'r',
		flipped: false,
		mode: 'setup',           /* setup 摆谱 / move 走子 / mark 标注 */
		palettePiece: null,      /* 摆谱模式下待放置的棋子字符 */
		selected: null,          /* 选中的棋子索引 */
		targets: [],             /* 合法落点索引 */
		lastMove: null,          /* 上一手 {from,to} */
		history: [],             /* 走子历史，用于撤销与棋谱 */
		viewPos: 0,              /* 当前浏览到的历史位置 */
		marks: [],               /* 标注：圈与方框 */
		arrows: [],              /* 标注：箭头 */
		markTool: 'circle',
		markColor: '#c0392b',
		arrowStart: null,        /* 箭头起点 */
		lastTouch: -1,           /* 最后一次触碰的棋盘格，供"清空该格"使用 */
		dirty: false             /* 局面是否被改动过 */
	};

	function toast(msg, isErr) {
		var t = document.getElementById('toast');
		if (!t) {
			t = document.createElement('div');
			t.id = 'toast';
			t.setAttribute('role', 'status');
			t.setAttribute('aria-live', 'polite');
			document.body.appendChild(t);
		}
		t.textContent = msg;
		t.className = 'on' + (isErr ? ' err' : '');
		clearTimeout(t._timer);
		t._timer = setTimeout(function () { t.className = ''; }, 2200);
	}

	/* 复制到剪贴板，兼容非安全上下文（file:// 打开时） */
	function copyText(text, okMsg) {
		var done = function () { toast(okMsg || '已复制'); };
		if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
		} else {
			fallbackCopy(text, done);
		}
	}
	function fallbackCopy(text, cb) {
		var ta = document.createElement('textarea');
		ta.value = text;
		ta.style.position = 'fixed';
		ta.style.opacity = '0';
		document.body.appendChild(ta);
		ta.select();
		try { document.execCommand('copy'); cb(); } catch (e) { toast('复制失败，请手动选择文本', true); }
		document.body.removeChild(ta);
	}

	function currentFen() {
		return FEN.toFen({ board: APP.board, turn: APP.turn });
	}

	/* ---------- 局面装载 ---------- */
	function loadFen(text, keepHistory) {
		var st;
		try {
			st = FEN.parse(text);
		} catch (e) {
			toast(e.message, true);
			return false;
		}
		APP.board = st.board;
		APP.turn = st.turn;
		APP.history = [{ board: cloneBoard(st.board), turn: st.turn, notation: '' }];
		APP.viewPos = 0;
		APP.lastMove = null;
		APP.selected = null;
		APP.targets = [];
		APP.dirty = false;
		renderAll();
		return true;
	}

	/* ---------- 走子 ---------- */
	function doMove(from, to) {
		if (!APP.board[from]) return false;
		if (colorOf(APP.board[from]) !== APP.turn) {
			toast('现在轮到' + (APP.turn === 'r' ? '红方' : '黑方') + '走棋', true);
			return false;
		}
		if (!CORE.isLegalMove(APP.board, from, to)) {
			toast(CORE.explainIllegal(APP.board, from, to), true);
			return false;
		}
		var notation = NOTATION.toChinese({ board: APP.board, turn: APP.turn }, from, to);
		var captured = CORE.makeMove(APP.board, from, to);
		APP.turn = APP.turn === 'r' ? 'b' : 'r';
		/* 截断 redo 分支 */
		APP.history = APP.history.slice(0, APP.viewPos + 1);
		APP.history.push({ board: cloneBoard(APP.board), turn: APP.turn, notation: notation, captured: captured, from: from, to: to });
		APP.viewPos = APP.history.length - 1;
		APP.lastMove = { from: from, to: to };
		APP.selected = null;
		APP.targets = [];
		APP.dirty = true;
		renderAll();
		return true;
	}

	function undo() {
		if (APP.viewPos <= 0) { toast('已经是最开始的位置'); return; }
		APP.viewPos--;
		restoreView();
	}
	function redo() {
		if (APP.viewPos >= APP.history.length - 1) { toast('已经是最新的位置'); return; }
		APP.viewPos++;
		restoreView();
	}
	function stepTo(pos) {
		if (pos < 0 || pos >= APP.history.length) return;
		APP.viewPos = pos;
		restoreView();
	}
	function restoreView() {
		var h = APP.history[APP.viewPos];
		APP.board = cloneBoard(h.board);
		APP.turn = h.turn;
		APP.selected = null;
		APP.targets = [];
		/* 上一手高亮：取当前步记录的起终点 */
		APP.lastMove = (APP.viewPos > 0 && h.from !== undefined)
			? { from: h.from, to: h.to } : null;
		renderAll();
	}

	/* ---------- 摆谱 ---------- */
	function placePiece(idx, pieceChar) {
		if (pieceChar) {
			if (APP.board[idx] === pieceChar) {
				APP.board[idx] = null;         /* 再次点击同子即移除 */
			} else {
				APP.board[idx] = pieceChar;
			}
		} else {
			APP.board[idx] = null;
		}
		APP.dirty = true;
		/*
		 * 摆谱会改变当前局面，因此历史从当前位置重新起算。
		 * 但不应把已记录的棋谱整段丢弃——摆谱本质是"在当前局面上继续研究"，
		 * 故保留已有记录，仅把当前位置作为新的观察点。
		 */
		APP.history = APP.history.slice(0, APP.viewPos + 1);
		APP.history[APP.viewPos] = {
			board: cloneBoard(APP.board), turn: APP.turn,
			notation: APP.history[APP.viewPos].notation,
			from: APP.history[APP.viewPos].from,
			to: APP.history[APP.viewPos].to
		};
		APP.lastMove = null;
		renderAll();
	}

	/* ---------- 标注 ---------- */
	function addMark(idx) {
		var row = Math.floor(idx / COLS), col = idx % COLS;
		if (APP.markTool === 'arrow') {
			if (!APP.arrowStart) {
				APP.arrowStart = { row: row, col: col };
				toast('已选箭头起点，再点终点');
				renderAll();
				return;
			}
			if (APP.arrowStart.row === row && APP.arrowStart.col === col) {
				APP.arrowStart = null;
				renderAll();
				return;
			}
			APP.arrows.push({ from: APP.arrowStart, to: { row: row, col: col }, color: APP.markColor, style: 'solid' });
			APP.arrowStart = null;
		} else {
			var type = APP.markTool === 'box' ? 'box' : 'circle';
			for (var i = APP.marks.length - 1; i >= 0; i--) {
				if (APP.marks[i].row === row && APP.marks[i].col === col) {
					APP.marks.splice(i, 1);
					renderAll();
					return;
				}
			}
			APP.marks.push({ row: row, col: col, type: type, color: APP.markColor });
		}
		APP.dirty = true;
		renderAll();
	}
	function deleteMarkAt(idx) {
		var row = Math.floor(idx / COLS), col = idx % COLS;
		var changed = false, i;
		for (i = APP.marks.length - 1; i >= 0; i--) {
			if (APP.marks[i].row === row && APP.marks[i].col === col) { APP.marks.splice(i, 1); changed = true; }
		}
		for (i = APP.arrows.length - 1; i >= 0; i--) {
			var a = APP.arrows[i];
			if ((a.from.row === row && a.from.col === col) || (a.to.row === row && a.to.col === col)) {
				APP.arrows.splice(i, 1); changed = true;
			}
		}
		if (changed) { toast('已删除该点标注'); renderAll(); }
		else toast('该点没有标注', true);
	}

	/* ---------- 渲染总入口 ---------- */
	function renderAll() {
		VIEW.renderPieces(APP.board, APP.flipped);
		var checkIdx = -1;
		if (CORE.isInCheck(APP.board, APP.turn)) {
			checkIdx = CORE.findKing(APP.board, APP.turn);
		}
		VIEW.renderHints(APP.board, APP.selected, APP.targets, APP.lastMove, checkIdx);
		VIEW.renderMarks(APP.marks);
		VIEW.renderArrows(APP.arrows);
		updatePanels();
	}

	/* ---------- 面板刷新 ---------- */
	function updatePanels() {
		/* 行棋方指示 */
		var ind = document.getElementById('turnInd');
		if (ind) {
			ind.innerHTML = '<span class="dot ' + APP.turn + '"></span>' +
				(APP.turn === 'r' ? '红方走棋' : '黑方走棋') +
				(APP.flipped ? ' · 已翻转' : '');
		}
		/* 合法性提示 */
		var v = CORE.validatePosition(APP.board);
		var st = document.getElementById('statusbar');
		if (st) {
			var parts = [];
			if (v.level === 'error') {
				parts.push('<span class="warn">⚠ ' + v.messages.join('；') + '</span>');
			} else if (v.level === 'warn') {
				parts.push('<span class="warn">注意：' + v.messages.join('；') + '</span>');
			} else {
				parts.push('<span class="ok">局面合法</span>');
			}
			if (CORE.isInCheck(APP.board, APP.turn)) {
				parts.push('<span class="warn">' + (APP.turn === 'r' ? '红方' : '黑方') + '被将军</span>');
			}
			var legal = CORE.generateMoves(APP.board, APP.turn);
			if (legal.length === 0) {
				parts.push('<span class="warn">' + (APP.turn === 'r' ? '红方' : '黑方') + '无子可动（' +
					(CORE.isInCheck(APP.board, APP.turn) ? '将死' : '困毙') + '）</span>');
			}
			parts.push('<span style="color:#a9977a">手数 ' + APP.viewPos + ' / ' + Math.max(0, APP.history.length - 1) + '</span>');
			if (APP.dirty) {
				parts.push('<span style="color:#c9a227">● 局面已改动</span>');
			}
			st.innerHTML = parts.join('　');
		}
		/* FEN */
		var fc = document.getElementById('fenCurrent');
		if (fc) fc.value = currentFen();
		/* 棋谱列表 */
		var ml = document.getElementById('moveList');
		if (ml) {
			var html = '';
			for (var i = 1; i < APP.history.length; i++) {
				var h = APP.history[i];
				if (!h.notation) continue;
				var side = h.turn === 'b' ? 'r' : 'b';   /* 走这步的一方是上一步结束前的行棋方 */
				var cls = side === 'r' ? 'red' : 'blk';
				html += '<li data-pos="' + i + '"' + (i === APP.viewPos ? ' class="cur"' : '') + '>' +
					'<span class="no">' + i + '</span><span class="' + cls + '">' + h.notation + '</span></li>';
			}
			ml.innerHTML = html || '<li style="color:#8a7a60;cursor:default">尚无走子记录</li>';
		}
		/* 收藏列表 */
		renderFavList();
	}

	/* ===== 模块 6：本地收藏 STORE ===== */
	var STORE = {};
	var KEY_ITEMS = 'xq.study.v1.items';
	var memoryItems = null;          /* localStorage 不可用时的内存降级 */
	var storageOK = true;

	/* 探针只在首次调用时真正写一次，之后复用结果，避免每次渲染都读写存储 */
	var storageProbed = false;
	STORE.storageAvailable = function () {
		if (storageProbed) return storageOK;
		storageProbed = true;
		try {
			localStorage.setItem('__xq_t', '1');
			localStorage.removeItem('__xq_t');
			storageOK = true;
		} catch (e) {
			storageOK = false;
		}
		return storageOK;
	};

	STORE.loadItems = function () {
		/* 已知本地存储不可用时，直接读内存副本 */
		if (!storageOK) return memoryItems ? memoryItems.slice() : [];
		if (!STORE.storageAvailable()) return memoryItems ? memoryItems.slice() : [];
		var raw;
		try {
			raw = localStorage.getItem(KEY_ITEMS);
		} catch (e) {
			storageOK = false;
			return memoryItems ? memoryItems.slice() : [];
		}
		if (!raw) return memoryItems ? memoryItems.slice() : [];
		try {
			var obj = JSON.parse(raw);
			if (!obj || obj.version !== 1 || !obj.items || !obj.items.length) {
				return memoryItems ? memoryItems.slice() : [];
			}
			var out = [], i, it;
			for (i = 0; i < obj.items.length; i++) {
				it = obj.items[i];
				if (!it || !it.id || !it.fen || !it.name) continue;   /* 坏条目直接丢弃 */
				out.push(it);
			}
			return out;
		} catch (e) {
			toast('本地收藏数据损坏，已忽略', true);
			return memoryItems ? memoryItems.slice() : [];
		}
	};

	STORE.saveItems = function (items) {
		if (!STORE.storageAvailable()) {
			storageOK = false;
			memoryItems = items.slice();
			return false;
		}
		try {
			localStorage.setItem(KEY_ITEMS, JSON.stringify({ version: 1, items: items }));
			memoryItems = items.slice();
			return true;
		} catch (e) {
			/* 写入失败（配额满等）：降级到内存，避免数据彻底丢失 */
			storageOK = false;
			memoryItems = items.slice();
			toast('本地存储写入失败，已暂存内存，请用「导出 JSON」备份', true);
			return false;
		}
	};

	STORE.addItem = function (data) {
		var items = STORE.loadItems();
		var it = {
			id: 't' + Date.now() + Math.floor(Math.random() * 1000),
			name: data.name,
			fen: data.fen,
			notes: data.notes || '',
			marks: data.marks || [],
			arrows: data.arrows || [],
			createdAt: Date.now(),
			updatedAt: Date.now()
		};
		items.unshift(it);
		STORE.saveItems(items);
		return it;
	};

	STORE.removeItem = function (id) {
		var items = STORE.loadItems(), i;
		for (i = 0; i < items.length; i++) {
			if (items[i].id === id) { items.splice(i, 1); break; }
		}
		STORE.saveItems(items);
	};

	STORE.updateItem = function (id, patch) {
		var items = STORE.loadItems(), i;
		for (i = 0; i < items.length; i++) {
			if (items[i].id === id) {
				for (var k in patch) {
					if (patch.hasOwnProperty(k)) items[i][k] = patch[k];
				}
				items[i].updatedAt = Date.now();
				break;
			}
		}
		STORE.saveItems(items);
	};

	STORE.exportJSON = function () {
		return JSON.stringify({ version: 1, items: STORE.loadItems() }, null, 2);
	};

	STORE.importJSON = function (text) {
		var obj;
		try {
			obj = JSON.parse(text);
		} catch (e) {
			toast('JSON 格式错误', true);
			return 0;
		}
		if (!obj || !obj.items || !obj.items.length) {
			toast('未找到可导入的收藏条目', true);
			return 0;
		}
		var items = STORE.loadItems(), i, it, ok = 0;
		for (i = 0; i < obj.items.length; i++) {
			it = obj.items[i];
			if (!it || !it.fen || !it.name) continue;
			/* 校验 FEN 合法性，防止导入脏数据 */
			try {
				FEN.parse(it.fen);
			} catch (e) {
				continue;
			}
			items.push({
				id: 't' + Date.now() + '_' + i + '_' + Math.floor(Math.random() * 1000),
				name: String(it.name).slice(0, 120), fen: String(it.fen).slice(0, 200),
				notes: String(it.notes || '').slice(0, 2000),
				marks: it.marks || [], arrows: it.arrows || [],
				createdAt: Date.now(), updatedAt: Date.now()
			});
			ok++;
		}
		STORE.saveItems(items);
		return ok;
	};

	function escapeHtml(s) {

	/* ===== 模块 7：预置经典残局 ===== */
	/* 由棋子坐标自动生成 FEN，避免手写 FEN 时行宽出错 */
	function fenOf(pieces, turn) {
		var board = [], i;
		for (i = 0; i < SIZE; i++) board[i] = null;
		for (i = 0; i < pieces.length; i++) {
			board[rc2idx(pieces[i][0], pieces[i][1])] = pieces[i][2];
		}
		return FEN.toFen({ board: board, turn: turn || 'r' });
	}
	var PRESETS = [
		{
			name: '马炮对士象（马踩中象）',
			pieces: [[9, 3, 'K'], [7, 4, 'N'], [5, 5, 'C'], [0, 4, 'k'], [0, 5, 'a'], [0, 2, 'b']],
			tip: '红方马炮帅对阵黑方士象将。思路是马先占中象卧槽位、炮控中路，黑方士象无处腾挪。'
		},
		{
			name: '双车对车马',
			pieces: [[9, 4, 'K'], [8, 1, 'R'], [8, 7, 'R'], [0, 3, 'k'], [2, 8, 'r'], [3, 1, 'n']],
			tip: '典型"双车错"攻杀结构。两车分踞两翼，轮流将军、对方只能被动挨打，是残局最常见的取胜组合。'
		},
		{
			name: '炮兵对马士',
			pieces: [[9, 4, 'K'], [5, 2, 'C'], [3, 0, 'P'], [0, 3, 'k'], [2, 5, 'n'], [0, 4, 'a']],
			tip: '炮兵配合的经典攻守局。炮镇中路、兵行其侧，练习"炮架"的运用与"兵卒"的推进节奏。'
		},
		{
			name: '单车对单车',
			pieces: [[9, 4, 'K'], [5, 4, 'R'], [0, 3, 'k'], [4, 1, 'r']],
			tip: '单对单最基础的残局。双方各一车一帅，核心在于抢先占据要点、抢占先手，别让对方先成"铁门栓"。'
		},
		{
			name: '单兵对士象（单兵难胜）',
			pieces: [[9, 4, 'K'], [4, 0, 'P'], [0, 3, 'k'], [0, 4, 'a'], [0, 6, 'b']],
			tip: '单兵对士象之和。兵虽过河可横走，但难以攻破士象防御，用来体会"过河兵"的威力与局限。'
		},

			pieces: [[9, 4, 'K'], [7, 4, 'N'], [6, 2, 'C'], [0, 3, 'k'], [2, 5, 'n'], [3, 6, 'c']],
			tip: '炮马对马炮的典型对攻局。子力相当，考验子力价值判断与配合次序，宜用走子模式逐手推演。'
		}
	];
	/* 生成 FEN 并做一次合法性体检，非法例题直接剔除 */
	for (var pi = 0; pi < PRESETS.length; pi++) {
		PRESETS[pi].fen = fenOf(PRESETS[pi].pieces);
	}

	/* ===== 模块 8：指针交互（触屏优先） ===== */
	var ghost = null;
	var dragging = null;

	function ensureGhost() {
		if (ghost) return ghost;
		ghost = document.createElement('div');
		ghost.id = 'dragGhost';
		ghost.style.cssText = 'position:fixed;left:0;top:0;width:62px;height:62px;margin:-31px 0 0 -31px;' +
			'border-radius:50%;display:none;align-items:center;justify-content:center;pointer-events:none;' +
			'font-family:"KaiTi","STKaiti","Kaiti SC",serif;font-size:34px;font-weight:700;color:#a8331f;' +
			'background:radial-gradient(circle at 35% 30%,#f7e6bd,#cfa963);border:2px solid #8a5a2b;' +
			'box-shadow:0 6px 14px rgba(0,0,0,.45);z-index:60;';
		document.body.appendChild(ghost);
		return ghost;
	}

	function onPointerDown(e) {
		if (e.button !== undefined && e.button !== 0) return;
		var idx = VIEW.hitTest(e.clientX, e.clientY);
		if (idx < 0) return;
		if (e.cancelable) e.preventDefault();
		/* 捕获指针，保证拖到棋盘外松手时仍能收到 pointerup，避免幽灵棋子残留 */
		if (svg && svg.setPointerCapture && e.pointerId !== undefined) {
			try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 某些环境不支持 */ }
		}

		if (APP.mode === 'setup') {
			/* 未选择棋子时不做任何事，避免误删盘面 */
			if (APP.palettePiece === null) {
				toast('请先在下方调色板选择要摆放的棋子', true);
				return;
			}
			placePiece(idx, APP.palettePiece);
			return;
		}
		if (APP.mode === 'mark') {
			addMark(idx);
			return;
		}
		/* 走子模式：按下己方棋子准备拖拽，点按则选中 */
		var ch = APP.board[idx];
		if (ch && colorOf(ch) === APP.turn) {
			dragging = { from: idx, moved: false, x: e.clientX, y: e.clientY };
			APP.selected = idx;
			APP.targets = legalTargetsOf(idx);
			renderAll();
			var g = ensureGhost();
			g.textContent = PIECE_NAME[colorOf(ch)][typeOf(ch)];
			g.style.color = colorOf(ch) === 'r' ? '#a8331f' : '#22201d';
			g.style.display = 'flex';
			g.style.left = e.clientX + 'px';
			g.style.top = e.clientY + 'px';
		} else if (APP.selected !== null) {
			/* 已选中棋子时点击目标点走子 */
			if (doMove(APP.selected, idx)) { /* 成功 */ }
			else if (APP.board[idx] && colorOf(APP.board[idx]) !== APP.turn) {
				/* 点对方子且不合法：提示原因 */
				toast(CORE.explainIllegal(APP.board, APP.selected, idx), true);
			}
			APP.selected = null;
			APP.targets = [];
			renderAll();
		}
	}

	function onPointerMove(e) {
		if (!dragging) return;
		var dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
		if (!dragging.moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
			dragging.moved = true;
		}
		if (dragging.moved && ghost) {
			ghost.style.left = e.clientX + 'px';
			ghost.style.top = e.clientY + 'px';
		}
	}

	function onPointerUp(e) {
		if (!dragging) return;
		var d = dragging;
		dragging = null;
		if (ghost) ghost.style.display = 'none';
		if (!d.moved) {
			/* 点按：保持选中状态即可（已在 down 中处理） */
			renderAll();
			return;
		}
		var idx = VIEW.hitTest(e.clientX, e.clientY);
		if (idx >= 0 && idx !== d.from) {
			doMove(d.from, idx);
		} else {
			APP.selected = null;
			APP.targets = [];
			renderAll();
		}
	}

	function onPointerCancel() {
		dragging = null;
		if (ghost) ghost.style.display = 'none';
		APP.selected = null;
		APP.targets = [];
		renderAll();
	}

	/* 选中棋子的合法落点 */
	function legalTargetsOf(idx) {
		var out = [], moves = CORE.generateMoves(APP.board, APP.turn), i;
		for (i = 0; i < moves.length; i++) {
			if (moves[i].from === idx) out.push(moves[i].to);
		}
		return out;
	}

	/* ===== 模块 9：调色板与事件装配 ===== */
	function buildPalette() {
		var box = document.getElementById('palette');
		if (!box) return;
		var html = '', side, order, i, ch;
		order = ['K', 'A', 'B', 'N', 'R', 'C', 'P'];
		for (side in PIECE_NAME) {
			if (!PIECE_NAME.hasOwnProperty(side)) continue;
			for (i = 0; i < order.length; i++) {
				ch = side === 'r' ? order[i] : order[i].toLowerCase();
				html += '<button data-piece="' + ch + '" class="' + (side === 'r' ? 'r' : 'b') +
					'" style="color:' + (side === 'r' ? '#a8331f' : '#22201d') + '">' +
					PIECE_NAME[side][order[i]] + '</button>';
			}
		}
		html += '<button data-piece="erase" class="erase" title="橡皮：点击格子清除棋子">擦</button>';
		box.innerHTML = html;
		var btns = box.getElementsByTagName('button'), k;
		for (k = 0; k < btns.length; k++) {
			btns[k].onclick = function () {
				var v = this.getAttribute('data-piece');
				/* erase 表示橡皮；null 表示尚未选择任何棋子 */
				APP.palettePiece = (v === 'erase') ? '' : v;
				for (var j = 0; j < btns.length; j++) btns[j].className = btns[j].className.replace(/\s*on\b/g, '');
				this.className += ' on';
				if (APP.mode !== 'setup') setMode('setup');
			};
		}
	}

	function setMode(mode) {
		APP.mode = mode;
		var seg = document.getElementById('segMode');
		if (seg) {
			var bs = seg.getElementsByTagName('button'), i;
			for (i = 0; i < bs.length; i++) {
				if (bs[i].getAttribute('data-mode') === mode) {
					bs[i].className = 'on';
					bs[i].setAttribute('aria-pressed', 'true');
				} else {
					bs[i].className = '';
					bs[i].setAttribute('aria-pressed', 'false');
				}
			}
		}
		APP.selected = null;
		APP.targets = [];
		APP.arrowStart = null;
		renderAll();
		/* 模式切换后把棋盘带回视野，便于立即操作 */
		var boardEl = document.getElementById('board');
		if (boardEl && boardEl.scrollIntoView) {
			boardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
		}
	}

	function bindEvents() {
		var svgEl = document.getElementById('board');
		svgEl.addEventListener('pointerdown', onPointerDown, { passive: false });
		svgEl.addEventListener('pointermove', onPointerMove, { passive: true });
		svgEl.addEventListener('pointerup', onPointerUp);
		svgEl.addEventListener('pointercancel', onPointerCancel);
		svgEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
		/* 兜底：指针在棋盘外抬起时也要清理幽灵棋子与选中态 */
		window.addEventListener('pointerup', function (e) {
			if (dragging) onPointerUp(e);
		});
		window.addEventListener('pointercancel', function () {
			if (dragging) onPointerCancel();
		});

		/* 模式切换 */
		var seg = document.getElementById('segMode');
		seg.addEventListener('click', function (e) {
			var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
			if (!b) return;
			setMode(b.getAttribute('data-mode'));
		});

		/* 标注工具 */
		var segM = document.getElementById('segMark');
		segM.addEventListener('click', function (e) {
			var b = e.target.closest ? e.target.closest('button[data-tool]') : null;
			if (!b) return;
			APP.markTool = b.getAttribute('data-tool');
			var bs = segM.getElementsByTagName('button'), i;
			for (i = 0; i < bs.length; i++) {
				var on = (bs[i].getAttribute('data-tool') === APP.markTool);
				bs[i].className = on ? 'on' : '';
				bs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
			}
			if (APP.mode !== 'mark') setMode('mark');
			/* 标注工具在下方面板，切换后把棋盘带回视野，免得手动上滑 */
			var boardEl = document.getElementById('board');
			if (boardEl && boardEl.scrollIntoView) {
				boardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
			}
		});
		document.getElementById('markColor').addEventListener('input', function () {

			document.getElementById('favName').value = '';
			document.getElementById('favNotes').value = '';
			renderFavList();
			toast(storageOK ? '已保存到本地棋谱库' : '已保存（本次仅在内存中，请导出 JSON 备份）');
		};
		document.getElementById('favList').addEventListener('click', function (e) {
			var b = e.target.closest ? e.target.closest('button[data-act]') : null;
			if (!b) return;
			var id = b.getAttribute('data-id'), act = b.getAttribute('data-act');
			var items = STORE.loadItems(), i, it = null;
			for (i = 0; i < items.length; i++) if (items[i].id === id) it = items[i];
			if (!it) return;
			if (act === 'load') {
				APP.marks = it.marks || []; APP.arrows = it.arrows || [];
				if (loadFen(it.fen)) toast('已载入：' + it.name);
			} else if (act === 'rename') {
				var nn = prompt('重命名局面', it.name);
				if (nn) { STORE.updateItem(id, { name: nn }); renderFavList(); }
			} else if (act === 'copy') {
				copyText(it.fen, 'FEN 已复制');
			} else if (act === 'del') {
				if (confirm('删除收藏「' + it.name + '」？')) {
					STORE.removeItem(id);
					renderFavList();
				}
			}
		});
		document.getElementById('btnExportFav').onclick = function () {
			var txt = STORE.exportJSON();
			var blob = new Blob([txt], { type: 'application/json' });
			var a = document.createElement('a');
			a.href = URL.createObjectURL(blob);
			a.download = '象棋残局收藏_' + new Date().toISOString().slice(0, 10) + '.json';
			document.body.appendChild(a); a.click(); document.body.removeChild(a);
			toast('已导出 JSON');
		};
		document.getElementById('btnImportFav').onclick = function () {
			document.getElementById('fileFav').click();
		};
		document.getElementById('fileFav').onchange = function () {
			var f = this.files && this.files[0];
			var input = this;
			if (!f) return;
			var rd = new FileReader();
			rd.onload = function () {
				var n = STORE.importJSON(rd.result);
				if (n) { renderFavList(); toast('已导入 ' + n + ' 条收藏'); }
				input.value = '';   /* 清空以便再次选择同一文件也能触发 change */
			};
			rd.onerror = function () { toast('文件读取失败', true); input.value = ''; };
			rd.readAsText(f);
		};

		/* 翻转 */
		function doFlip() {
			APP.flipped = !APP.flipped;
			VIEW.setFlipped(APP.flipped);
			renderAll();
		}
		document.getElementById('btnFlip').onclick = doFlip;
		document.getElementById('qFlip').onclick = doFlip;

		/* 移动端快捷条 */
		document.getElementById('qUndo').onclick = undo;
		document.getElementById('qRedo').onclick = redo;
		document.getElementById('qPrev').onclick = function () { stepTo(APP.viewPos - 1); };
		document.getElementById('qNext').onclick = function () { stepTo(APP.viewPos + 1); };

		/* 棋谱列表跳转 */
		document.getElementById('moveList').addEventListener('click', function (e) {
			var li = e.target.closest ? e.target.closest('li[data-pos]') : null;
			if (!li) return;
			stepTo(parseInt(li.getAttribute('data-pos'), 10));
		});

		/* 键盘快捷键 */
		document.addEventListener('keydown', function (e) {
			/* 输入框、下拉框获得焦点时不劫持按键 */
			var tag = e.target && e.target.tagName;
			if (tag && /input|textarea|select/i.test(tag)) return;
			if (e.target && e.target.isContentEditable) return;
			if (e.ctrlKey || e.metaKey) {
				if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
				else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redo(); }
			} else if (e.key === 'ArrowLeft') { stepTo(APP.viewPos - 1); }
			else if (e.key === 'ArrowRight') { stepTo(APP.viewPos + 1); }
			else if (e.key === 'f' || e.key === 'F') { doFlip(); }
		});

		document.getElementById('btnSelftest').onclick = function () {
			var r = selfTest();
			var lines = [], i;
			for (i = 0; i < r.results.length; i++) {
				lines.push((r.results[i].ok ? '✓ ' : '✗ ') + r.results[i].name +
					(r.results[i].ok ? '' : ' —— ' + r.results[i].msg));
			}
			var box = document.getElementById('fenTip');
			if (box) {
				box.innerHTML = '<b>' + (r.pass + '/' + r.total) + ' 项通过</b><br>' +
					lines.join('<br>');
			}
			toast('规则自测：' + r.pass + '/' + r.total + ' 通过', r.pass !== r.total);
			console.log('%c象棋规则自测 ' + r.pass + '/' + r.total, 'font-weight:bold');
			console.log(lines.join('\n'));
		};
	}

	/* 记录最后一次触碰的格子，供"清空该格""删除该点"使用 */
	document.addEventListener('pointerdown', function (e) {
		var idx = VIEW.hitTest(e.clientX, e.clientY);
		if (idx >= 0) APP.lastTouch = idx;
	}, true);

	/* ===== 模块 10：内置回归自测 ===== */
	function selfTest() {
		var results = [], total = 0, pass = 0;
		function t(name, fn) {
			total++;
			try {
				var ok = fn();
				results.push({ name: name, ok: !!ok, msg: ok ? '' : '断言失败' });
				if (ok) pass++;
			} catch (e) {
				results.push({ name: name, ok: false, msg: e.message });
			}
		}
		function mk(pieces) {
			var b = [], i;
			for (i = 0; i < SIZE; i++) b[i] = null;
			for (i = 0; i < pieces.length; i++) {
				b[rc2idx(pieces[i][0], pieces[i][1])] = pieces[i][2];
			}
			return b;
		}
		function canMove(board, from, to) {
			return CORE.pseudoTargets(board, from).indexOf(to) >= 0;
		}
		function S(fen) { return FEN.parse(fen); }

		t('初始 FEN 往返一致', function () {
			var st = S(INITIAL_FEN);
			return FEN.toFen(st) === INITIAL_FEN;
		});
		t('炮二平五 合法且记谱正确', function () {
			var st = S(INITIAL_FEN);
			var from = rc2idx(7, 7), to = rc2idx(7, 4);
			if (!CORE.isLegalMove(st.board, from, to)) return false;
			return NOTATION.toChinese(st, from, to) === '炮二平五';
		});
		t('另一门炮记为 炮八平五', function () {
			var st = S(INITIAL_FEN);
			var from = rc2idx(7, 1), to = rc2idx(7, 4);
			return CORE.isLegalMove(st.board, from, to) &&
				NOTATION.toChinese(st, from, to) === '炮八平五';
		});
		t('马八进七 合法且记谱正确', function () {
			var st = S(INITIAL_FEN);
			var from = rc2idx(9, 1), to = rc2idx(7, 2);
			if (!CORE.isLegalMove(st.board, from, to)) return false;
			return NOTATION.toChinese(st, from, to) === '马八进七';
		});
		t('黑方记谱 马8进7', function () {
			var st = S(INITIAL_FEN);
			var from = rc2idx(0, 7), to = rc2idx(2, 6);
			if (!CORE.isLegalMove(st.board, from, to)) return false;
			return NOTATION.toChinese(st, from, to) === '马8进7';
		});
		t('象不可过河（红相）', function () {
			var b = mk([[5, 2, 'B'], [9, 3, 'K'], [0, 4, 'k']]);
			return !canMove(b, rc2idx(5, 2), rc2idx(3, 0));
		});
		t('象在己方半场可行（红相）', function () {
			var b = mk([[5, 2, 'B'], [9, 3, 'K'], [0, 4, 'k']]);
			return canMove(b, rc2idx(5, 2), rc2idx(7, 0));
		});
		t('塞象眼则不可行', function () {
			var b = mk([[9, 2, 'B'], [8, 3, 'P'], [5, 0, 'k']]);
			return !canMove(b, rc2idx(9, 2), rc2idx(7, 4));
		});
		t('黑象不可过河', function () {
			var b = mk([[4, 2, 'b'], [0, 4, 'k'], [9, 3, 'K']]);
			return !canMove(b, rc2idx(4, 2), rc2idx(6, 0));
		});
		t('蹩马腿则不可行', function () {
			var b = mk([[9, 8, 'N'], [8, 8, 'P'], [0, 0, 'k']]);
			return !canMove(b, rc2idx(9, 8), rc2idx(7, 7));
		});
		t('马腿空则可行', function () {
			var b = mk([[9, 8, 'N'], [0, 0, 'k']]);
			return canMove(b, rc2idx(9, 8), rc2idx(7, 7));
		});
		t('炮隔一子可吃', function () {
			var b = mk([[5, 0, 'C'], [4, 0, 'P'], [3, 0, 'r'], [0, 8, 'k'], [9, 8, 'K']]);
			return canMove(b, rc2idx(5, 0), rc2idx(3, 0));
		});
		t('炮紧邻不可吃', function () {
			var b = mk([[5, 0, 'C'], [4, 0, 'r'], [0, 8, 'k'], [9, 8, 'K']]);
			return !canMove(b, rc2idx(5, 0), rc2idx(4, 0));
		});
		t('炮隔两子不可吃', function () {
			var b = mk([[5, 0, 'C'], [4, 0, 'P'], [3, 0, 'P'], [2, 0, 'r'], [0, 8, 'k'], [9, 8, 'K']]);
			return !canMove(b, rc2idx(5, 0), rc2idx(2, 0));
		});
		t('未过河红兵不可横走', function () {
			var b = mk([[5, 2, 'P'], [0, 8, 'k'], [9, 0, 'K']]);
			return !canMove(b, rc2idx(5, 2), rc2idx(5, 3));
		});
		t('已过河红兵可横走', function () {
			var b = mk([[4, 2, 'P'], [0, 8, 'k'], [9, 0, 'K']]);
			return canMove(b, rc2idx(4, 2), rc2idx(4, 3));
		});
		t('兵不可后退', function () {
			var b = mk([[4, 2, 'P'], [0, 8, 'k'], [9, 0, 'K']]);
			return !canMove(b, rc2idx(4, 2), rc2idx(5, 2));
		});
		t('黑卒过河后可横走', function () {
			var b = mk([[5, 2, 'p'], [0, 8, 'k'], [9, 0, 'K']]);
			return canMove(b, rc2idx(5, 2), rc2idx(5, 3));
		});
		t('将帅照面被判定为非法局面', function () {
			var b = mk([[9, 4, 'K'], [0, 4, 'k']]);
			return CORE.validatePosition(b).level === 'error' && CORE.kingsFacing(b);
		});
		t('走子后造成照面则该步非法', function () {
			var b = mk([[9, 4, 'K'], [0, 4, 'k'], [4, 4, 'P']]);
			/* 红兵已过河，横走出中路即造成将帅照面 */
			return !CORE.isLegalMove(b, rc2idx(4, 4), rc2idx(4, 3));
		});
		t('自陷送将的着法被判非法', function () {
			var b = mk([[9, 4, 'K'], [8, 4, 'R'], [0, 4, 'r'], [0, 8, 'k']]);
			/* 红车横移让开中路，黑车即可沿第 4 线直取红帅 */
			return !CORE.isLegalMove(b, rc2idx(8, 4), rc2idx(8, 0));
		});
		t('禁止直接吃将帅', function () {
			var b = mk([[9, 4, 'K'], [5, 4, 'R'], [0, 4, 'k']]);
			return !CORE.isLegalMove(b, rc2idx(5, 4), rc2idx(0, 4));
		});
		t('缺将时不崩溃', function () {
			var b = mk([[5, 4, 'R'], [0, 4, 'k']]);
			var r = CORE.isInCheck(b, 'r');
			return r === false && CORE.validatePosition(b).level === 'error';
		});
		t('士不可出九宫', function () {
			var b = mk([[9, 3, 'A'], [0, 8, 'k'], [5, 8, 'K']]);
			return !canMove(b, rc2idx(9, 3), rc2idx(8, 2));
		});
		t('帅不可斜行', function () {
			var b = mk([[9, 4, 'K'], [0, 8, 'k']]);
			return !canMove(b, rc2idx(9, 4), rc2idx(8, 3));
		});
		t('同线双炮记为 前炮/后炮', function () {
			var b = mk([[3, 1, 'C'], [7, 1, 'C'], [9, 4, 'K'], [0, 4, 'k']]);
			var front = NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(3, 1), rc2idx(2, 1));
			var back = NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(7, 1), rc2idx(6, 1));
			return front === '前炮进一' && back === '后炮进一';
		});
		t('三兵同线记为 前/中/后', function () {
			var b = mk([[1, 1, 'P'], [3, 1, 'P'], [5, 1, 'P'], [9, 4, 'K'], [0, 4, 'k']]);
			var m = NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(1, 1), rc2idx(0, 1));
			var c = NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(3, 1), rc2idx(2, 1));
			return m === '前兵进一' && c === '中兵进一';
		});
		t('FEN 行宽错误时报错不崩溃', function () {
			var threw = false;
			try { FEN.parse('rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNRR w - - 0 1'); }
			catch (e) { threw = true; }
			return threw;
		});
		t('FEN 行数错误时报错', function () {
			var threw = false;
			try { FEN.parse('rnbakabnr/9 w - - 0 1'); } catch (e) { threw = true; }
			return threw;
		});
		t('FEN 兼容 E 表示象', function () {
			var st = FEN.parse('4k4/9/9/9/9/9/9/9/9/4E4 w - - 0 1');
			return st.board[rc2idx(9, 4)] === 'B';
		});
		t('FEN 兼容 H 表示马', function () {
			var st = FEN.parse('4k4/9/9/9/9/9/9/9/9/4H4 w - - 0 1');
			return st.board[rc2idx(9, 4)] === 'N';
		});
		t('FEN 行数可只写两段', function () {
			var st = FEN.parse('rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR');
			return st.turn === 'r' && st.board.length === 90;
		});
		t('FEN 中 b 表示黑方先行', function () {
			var st = FEN.parse('rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR b - - 0 1');
			return st.turn === 'b';
		});
		t('FEN 中 r 视为红方先行', function () {
			var st = FEN.parse('rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR r - - 0 1');
			return st.turn === 'r';
		});
		t('将帅记谱 帅五进一', function () {
			var b = mk([[9, 4, 'K'], [0, 8, 'k'], [5, 8, 'r']]);
			return NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(9, 4), rc2idx(8, 4)) === '帅五进一';
		});
		t('车记谱 车三进五（红三路=col6）', function () {
			var b = mk([[7, 6, 'R'], [9, 0, 'K'], [0, 8, 'k']]);
			return NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(7, 6), rc2idx(2, 6)) === '车三进五';
		});
		t('马记谱 马八进七（斜行进退记纵线）', function () {
			var b = mk([[9, 1, 'N'], [0, 8, 'k']]);
			return NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(9, 1), rc2idx(7, 2)) === '马八进七';
		});
		t('炮横走记目标纵线 炮二平五', function () {
			var b = mk([[7, 7, 'C'], [9, 0, 'K'], [0, 8, 'k']]);
			return NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(7, 7), rc2idx(7, 4)) === '炮二平五';
		});
		t('兵横走记目标纵线 兵七平八（红七路=col2→col1）', function () {
			var b = mk([[4, 2, 'P'], [9, 0, 'K'], [0, 8, 'k']]);
			return NOTATION.toChinese({ board: b, turn: 'r' }, rc2idx(4, 2), rc2idx(4, 1)) === '兵七平八';
		});
		t('黑方纵线号自左向右', function () {
			var b = mk([[0, 0, 'r'], [9, 0, 'K']]);
			return NOTATION.toChinese({ board: b, turn: 'b' }, rc2idx(0, 0), rc2idx(0, 1)) === '车1平2';
		});
		t('生成合法着法列表', function () {
			var st = S(INITIAL_FEN);
			var mv = CORE.generateMoves(st.board, 'r');
			return mv.length > 0 && mv.every(function (m) { return m.from !== m.to; });
		});
		t('预置残局 FEN 全部合法', function () {
			var i, st, v;
			for (i = 0; i < PRESETS.length; i++) {
				st = S(PRESETS[i].fen);
				if (st.board.length !== 90) throw new Error(PRESETS[i].name + '：棋盘长度异常');
				v = CORE.validatePosition(st.board);
				if (v.level === 'error') throw new Error(PRESETS[i].name + '：' + v.messages.join('；'));
			}
			return true;
		});
		t('预置残局双将俱全且不照面', function () {
			var i, st;
			for (i = 0; i < PRESETS.length; i++) {
				st = S(PRESETS[i].fen);
				if (CORE.findKing(st.board, 'r') < 0) throw new Error(PRESETS[i].name + '：缺红帅');
				if (CORE.findKing(st.board, 'b') < 0) throw new Error(PRESETS[i].name + '：缺黑将');
				if (CORE.kingsFacing(st.board)) throw new Error(PRESETS[i].name + '：将帅照面');
			}
			return true;
		});
		t('预置残局 FEN 往返一致', function () {
			var i, st;
			for (i = 0; i < PRESETS.length; i++) {
				st = S(PRESETS[i].fen);
				if (FEN.toFen(st) !== PRESETS[i].fen) throw new Error(PRESETS[i].name + '：往返不一致');
			}
			return true;
		});

		return { total: total, pass: pass, results: results };
	}

	/* ===== 模块 11：启动 ===== */
	function init() {
		VIEW.init(document.getElementById('board'));
		VIEW.setFlipped(false);
		buildPalette();
		bindEvents();
		loadFen(INITIAL_FEN);
		/* 首次访问若本地存储不可用，提示用户用 JSON 备份 */
		if (!STORE.storageAvailable()) {
			setTimeout(function () {
				toast('浏览器限制了本地存储，收藏仅在本次会话有效，请用「导出 JSON」备份', true);
			}, 800);
		}
	}

	/* 暴露到全局，便于控制台调试 */
	XQ.CORE = CORE; XQ.FEN = FEN; XQ.NOTATION = NOTATION;
	XQ.VIEW = VIEW; XQ.STORE = STORE; XQ.APP = APP; XQ.PRESETS = PRESETS;
	XQ.selfTest = selfTest;
	XQ.toFen = currentFen;

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init);
	} else {
		init();
	}
})();
</script>
</body>
</html>
